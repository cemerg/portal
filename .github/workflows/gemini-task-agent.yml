name: Gemini AI Task Agent

on:
  issues:
    types: [opened, edited]

jobs:
  gemini-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Gemini CLI Action
        uses: google-github-actions/run-gemini-cli@main
        with:
          prompt: |
            You are an autonomous AI developer working on this codebase. 
            The user created Issue #${{ github.event.issue.number }}:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}
            
            Please analyze the request, write or modify the required code files, and make sure everything is clean.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}